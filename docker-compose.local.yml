# This machine's campus DNS and loopback-only deployment. Start with both compose files.
services:
  db:
    ports:
      - "127.0.0.1:55432:5432"
  setup:
    network_mode: host
    environment:
      DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD}@127.0.0.1:55432/aihot
      API_BASE_URL: http://127.0.0.1:3001
  api:
    network_mode: host
    environment:
      DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD}@127.0.0.1:55432/aihot
      API_BASE_URL: http://127.0.0.1:3001
      API_HOST: 127.0.0.1
  worker:
    network_mode: host
    environment:
      DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD}@127.0.0.1:55432/aihot
      API_BASE_URL: http://127.0.0.1:3001
  web:
    network_mode: host
    ports: !reset []
    environment:
      API_BASE_URL: http://127.0.0.1:3001
      WEB_HOST: 127.0.0.1
